<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journey | Eid 2026</title>
    <style>
        :root {
            --gold: #D4AF37;
            --deep-space: #050b16;
            --horizon: #0a192f;
            --envelope-red: #a31a1a;
            --envelope-flap: #c42121;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; min-height: 100vh;
            background: linear-gradient(to bottom, var(--deep-space) 0%, var(--horizon) 100%);
            background-attachment: fixed;
            color: white;
            font-family: 'Palatino', serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .stars-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .main-content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px 20px; box-sizing: border-box; text-align: center; }

        /* --- UI COMPONENTS --- */
        .envelope-wrapper { position: relative; width: 280px; height: 220px; margin: 40px auto; perspective: 1000px; }
        .envelope { width: 100%; height: 100%; background: var(--envelope-red); position: absolute; bottom: 0; border-radius: 0 0 8px 8px; z-index: 20; cursor: pointer; }
        .envelope::before { content: ''; position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-top: 130px solid var(--envelope-flap); transition: transform 0.6s; z-index: 25; transform-origin: top; }
        .envelope.open::before { transform: rotateX(180deg); z-index: 5; }
        .eidi-card { position: absolute; top: 10px; left: 10px; width: 260px; background: white; padding: 10px; z-index: 10; transition: 0.8s; opacity: 0; border-radius: 4px; }
        .envelope.open + .eidi-card { transform: translateY(-180px); opacity: 1; z-index: 30; }

        .upload-container { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; border: 1px solid var(--gold); width: 90%; max-width: 400px; backdrop-filter: blur(10px); }
        .file-label { display: block; border: 2px dashed var(--gold); padding: 20px; cursor: pointer; border-radius: 10px; margin-bottom: 15px; color: var(--gold); font-weight: bold; }
        #preview-img { width: 100%; border-radius: 10px; display: none; margin-bottom: 15px; }
        .letter-area { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 15px; color: white; margin-bottom: 20px; }
        
        .send-btn { background: var(--gold); color: black; border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.1rem; box-shadow: 0 0 15px var(--gold); }
        .countdown { font-size: 6rem; color: var(--gold); font-weight: bold; text-shadow: 0 0 40px rgba(212,175,55,0.8); }

        #hero-section, #envelope-section, #interaction-section, #timer-screen, #final-screen { display: none; }
    </style>
</head>
<body>

    <div class="stars-container" id="starfield"></div>

    <div class="main-content">
        <div id="hero-section" class="section" style="display: flex;">
            <h1 style="font-size: 3rem; color: var(--gold);">Hey, Beautiful</h1>
            <p style="letter-spacing: 5px;">SCROLL FOR YOUR SURPRISE</p>
        </div>

        <div id="envelope-section" class="section" style="display: flex;">
            <h2 style="color: var(--gold);">A Special Eidi</h2>
            <div class="envelope-wrapper">
                <div class="envelope" onclick="this.classList.toggle('open')"></div>
                <div class="eidi-card">
                    <img src="Mine.png" alt="Eidi" style="width:100%">
                    <p style="color: #a31a1a; font-weight: bold;">I LOVE YOU ❤️</p>
                </div>
            </div>
        </div>

        <div class="section" id="interaction-section" style="display: flex;">
            <h2 style="color: var(--gold);">Sighting My Moon</h2>
            <div class="upload-container">
                <form id="eid-form">
                    <img id="preview-img" src="">
                    <label for="file-input" class="file-label" id="drop-zone">
                        <span>Tap to choose your photo ✨</span>
                        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="previewFile()">
                    </label>
                    <textarea id="user-msg" class="letter-area" rows="4" placeholder="Your message..."></textarea>
                    
                    <button type="button" class="send-btn" onclick="triggerSend()">SEND TO ME ✨</button>
                    <p style="color: var(--gold); font-size: 0.8rem; margin-top:15px; animation: pulse 2s infinite;">(Come back here for your wish!)</p>
                </form>
            </div>
        </div>

        <div class="section" id="timer-screen">
            <h1 style="color: var(--gold); font-size: 3rem;">Chand Raat Mubarak!</h1>
            <p id="timer-status">SIGHTING THE MOON...</p>
            <div class="countdown" id="countdown">60</div>
        </div>

        <div class="section" id="final-screen">
            <h1 style="font-size: 4rem; color: var(--gold);">Eid Mubarak!</h1>
            <p>My world is complete. 🌙💖</p>
        </div>
    </div>

    <script>
        const MY_EMAIL = "YOUR_EMAIL@gmail.com"; // <-- CHANGE THIS TO YOUR REAL EMAIL
        const MY_PHONE = "923362842234";
        const TIMER_SECONDS = 60;
        let countdownInterval;

        window.onload = function() {
            const savedEnd = localStorage.getItem('eidTimerEnd');
            if (savedEnd) {
                const remaining = Math.floor((savedEnd - Date.now()) / 1000);
                if (remaining > 0) startTimerUI(remaining);
                else showFinal();
            }
        };

        function previewFile() {
            const preview = document.getElementById('preview-img');
            const file = document.getElementById('file-input').files[0];
            const reader = new FileReader();
            reader.onloadend = () => { 
                preview.src = reader.result; 
                preview.style.display = 'block'; 
                document.getElementById('drop-zone').style.display = 'none'; 
            }
            if (file) reader.readAsDataURL(file);
        }

        function triggerSend() {
            if (!document.getElementById('file-input').files[0]) {
                alert("Please select your photo first! 🌙");
                return;
            }

            const msg = document.getElementById('user-msg').value;
            
            // 1. Set Timer Lock
            const endTime = Date.now() + (TIMER_SECONDS * 1000);
            localStorage.setItem('eidTimerEnd', endTime);

            // 2. Open WhatsApp with instruction to ATTACH
            const waText = encodeURIComponent(`🌙 *Moon Sighted!* 🌙\n\n"${msg}"\n\n(I am attaching my photo now... check your email too!)`);
            window.open(`https://wa.me/${MY_PHONE}?text=${waText}`, '_blank');

            // 3. Open Email App as backup
            setTimeout(() => {
                const mailBody = encodeURIComponent(`Hey! Here is my moon sighting photo and message:\n\n"${msg}"\n\n(Don't forget to attach the photo!)`);
                window.location.href = `mailto:${MY_EMAIL}?subject=Eid Moon Sighting&body=${mailBody}`;
            }, 1000);
        }

        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible') {
                const savedEnd = localStorage.getItem('eidTimerEnd');
                if (savedEnd) {
                    const remaining = Math.floor((savedEnd - Date.now()) / 1000);
                    if (remaining > 0) startTimerUI(remaining);
                }
            }
        });

        function startTimerUI(seconds) {
            document.getElementById('hero-section').style.display = 'none';
            document.getElementById('envelope-section').style.display = 'none';
            document.getElementById('interaction-section').style.display = 'none';
            document.getElementById('timer-screen').style.display = 'flex';
            
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                const savedEnd = localStorage.getItem('eidTimerEnd');
                const remaining = Math.floor((savedEnd - Date.now()) / 1000);
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    showFinal();
                } else {
                    document.getElementById('countdown').innerText = remaining;
                }
            }, 1000);
        }

        function showFinal() {
            document.getElementById('timer-screen').style.display = 'none';
            document.getElementById('final-screen').style.display = 'flex';
        }

        // Stars setup
        const starContainer = document.getElementById('starfield');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = '2px'; star.style.height = '2px';
            star.style.backgroundColor = 'white';
            starContainer.appendChild(star);
        }
    </script>
</body>
</html>
